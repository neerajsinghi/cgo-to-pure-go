name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: Test with cgo and the race detector
        run: go test -race ./...

      - name: Test pure-Go package without cgo
        run: CGO_ENABLED=0 go test ./purego/... ./codec/...

      - name: Test the purego build tag
        run: go test -tags purego ./codec/...

      - name: Build static binary
        run: make build-static

      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchmem -benchtime=100x ./...
